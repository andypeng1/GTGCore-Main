plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '7.0.2'
    // 使用官方 Forge Gradle 插件（稳定版）
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang 从 1.18+ 开始向最终用户提供 Java 17，所以你的模组应该目标为 Java 17。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // 这个属性允许 Gradle 的 ProcessResources 任务在启动游戏前，在 IDE 输出位置运行。
    // 此模板要求必须设置为 true。
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // 标准 MDK 配置：dev 环境把模组 refmap 中的 SRG 名反查为官方名，
            // 否则依赖模组（如 GTCEu 7.x）的 mixin 按 refmap 找不到目标而崩溃
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // dev 环境兜底：完全禁用 refmap 解析（dev 类名即官方名，无需 refmap）
            property 'mixin.env.disableRefMap', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            args '--existing-mod', 'gtceu'
        }
    }
}

// 包含数据生成器生成的资源
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    // GTM 和 LDLib
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    // KubeJS / Rhino
    maven {
        url = "https://maven.latvian.dev/releases"
    }
    // Registrate
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    // Configuration（dev.toma.configuration）
    maven {
        name = 'FirstDarkDev'
        url = "https://maven.firstdarkdev.xyz/snapshots/"
    }
    // Architectury
    maven {
        url = "https://maven.architectury.dev"
    }
    // CurseForge Proxy
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // GTM
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") {
        transitive = false
    }
    // Configuration
    implementation fg.deobf("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    // Architectury API
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    // Registrate
    // implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    // kubejs
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    // rhino
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    // MixinExtras：声明与 GTCEu jarjar 内嵌版本一致的 0.5.3（KubeJS 内嵌了远古的 0.2.0-rc.2，
    // 显式声明保证 classpath 上有现代版本；dev 环境的 GTCEu mixin 崩溃另有兼容 mixin 处理）
    implementation "io.github.llamalad7:mixinextras-forge:0.5.3"
    // JEI Unofficial
    compileOnly fg.deobf("curse.maven:jei-unofficial-1642978:8668196")
    runtimeOnly fg.deobf("curse.maven:jei-unofficial-1642978:8668196")
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// Maven Release Config
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}