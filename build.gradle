plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '7.0.2'
    // 使用官方 Forge Gradle 插件（稳定版）
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang 从 1.18+ 开始向最终用户提供 Java 17，所以你的模组应该目标为 Java 17。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// ===== dev 专用兼容模组（devcompat）=====
// Forge 1.20.1 dev 的目录型模组无法注册 mixin 配置（容器资源扫描覆盖不到目录），
// 所以把兼容 mixin（为 GTCEu 7.5.3 的 GuiGraphicsMixin 补充 m_280405_ 目标方法）打包成
// 独立 jar 模组挂到 runtimeClasspath：jar 会被 mixin 容器正常扫描注册。
// 该 jar 只存在于 dev 运行，不进入正式模组产物。
sourceSets {
    devcompat {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // 这个属性允许 Gradle 的 ProcessResources 任务在启动游戏前，在 IDE 输出位置运行。
    // 此模板要求必须设置为 true。
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // 标准 MDK 配置：
            // 1) remapRefMap：把 refmap 从 SRG 反查为官方名（标准 MDK 行为）
            //    注意：文件属性名必须是 mixin.env.refMapRemappingFile（带 env 段）——
            //    mixin 0.8.5 的 RemappingReferenceMapper 读取 REFMAP_REMAP_RESOURCE 选项
            //    （mixin.env.refMapRemappingFile）；写错成 mixin.refMapRemappingFile 时
            //    选项读不到文件，srg→mcp 反查静默失效，外部 mod 的 refmap 保持 SRG 域，
            //    在 dev（官方名域）里注入全部失败。
            // 2) 注意不要加 mixin.env.disableRefMap —— 渲染/优化类 mod（Oculus/Embeddium 等）
            //    的 @Shadow 名字是 SRG 名，靠 refmap 反查成官方名才能在 dev 工作；
            //    GTCEu 的 mixin 目标（refmap 值带 owner 前缀、无法反查）由 devcompat 兼容模组补充。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // dev 环境 105 mods 内存需求大：-Xmx8G 防世界创建阶段 OOM
            // （之前无 jvmArgs 默认 2-4G，创建世界数据包重载 + 类转换时
            //  OutOfMemoryError → GC 停顿表现为"卡住未响应"）。
            // mixin.debug.export 导出所有转换类（.mixin.out）内存/IO 巨大——已关闭；
            // 需要调试注入目标时临时开 mixin.debug.verbose。
            jvmArgs '-Xmx8G', '-Xms2G'
            property 'mixin.debug.verbose', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
                // devcompat 兼容模组（CoreMod + mixin）
                "gtgcore_devcompat" {
                    source sourceSets.devcompat
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            args '--existing-mod', 'gtceu'
        }
    }
}

// 包含数据生成器生成的资源
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    // GTM 和 LDLib
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
    }
    // KubeJS / Rhino
    maven {
        url = "https://maven.latvian.dev/releases"
    }
    // Registrate
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    // Configuration（dev.toma.configuration）
    maven {
        name = 'FirstDarkDev'
        url = "https://maven.firstdarkdev.xyz/snapshots/"
    }
    // Architectury
    maven {
        url = "https://maven.architectury.dev"
    }
    // CurseForge Proxy
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Jetbrains
    compileOnly("org.jetbrains:annotations:26.0.1")
    // GTM
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") {
        transitive = false
    }
    // LDlib
    implementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") {
        transitive = false
    }
    // Configuration
    implementation fg.deobf("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    // Architectury API
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    // Registrate
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    // kubejs
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    // rhino
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    // MixinExtras：声明与 GTCEu jarjar 内嵌版本一致的 0.5.3（KubeJS 内嵌了远古的 0.2.0-rc.2，
    // 显式声明保证 classpath 上有现代版本；dev 环境的 GTCEu mixin 崩溃另有兼容 mixin 处理）
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:0.5.3")
    // JEI（与整合包环境一致：GTCEu 7.5.3 + JEI）
    compileOnly fg.deobf("curse.maven:jei-unofficial-1642978:8668196")
    runtimeOnly fg.deobf("curse.maven:jei-unofficial-1642978:8668196")
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}

// ===== dev 专用兼容模组（devcompat）=====
// Forge 1.20.1 dev 的目录型模组无法注册 mixin 配置（容器资源扫描覆盖不到目录），
// 所以把兼容 mixin（为 GTCEu 7.5.3 的 GuiGraphicsMixin 补充 m_280405_ 目标方法）打包成
// 独立 jar 模组挂到 runtimeClasspath：jar 会被 mixin 容器正常扫描注册。
// 该 jar 只存在于 dev 运行，不进入正式模组产物。

tasks.register('devCompatJar', Jar) {
    archiveFileName = 'gtgcore-devcompat.jar'
    destinationDirectory = layout.buildDirectory.dir('devcompat')
    from sourceSets.devcompat.output
    // Forge 1.20.1 的 mixin 容器通过 jar 清单的 MixinConfigs 属性注册 mixin 配置
    manifest {
        attributes 'MixinConfigs': 'gtgcore.mixins.json'
    }
}

// 复制 devcompat jar 到 run/mods 目录（userdev 环境需要 jar 在 mods 目录才能加载）
tasks.register('copyDevcompatToMods', Copy) {
    dependsOn 'devCompatJar'
    from layout.buildDirectory.file('devcompat/gtgcore-devcompat.jar')
    into layout.projectDirectory.dir('run/mods')
}

// 保证 dev 运行前生成并复制 devcompat jar
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer' || name == 'runData') {
        dependsOn 'copyDevcompatToMods'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// Maven Release Config
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ===== 生成 fix_injections.js 的任务 =====
tasks.register('generateFixInjections', JavaExec) {
    description = '编译并运行 GenerateFixInjections2 生成 fix_injections.js'
    group = 'devcompat'
    
    // 设置 classpath
    classpath = files('devtools', 'devtools/asm-9.9.1.jar', 'devtools/asm-tree-9.9.1.jar')
    
    // 设置主类
    mainClass = 'GenerateFixInjections2'
    
    // 设置参数
    args = [
        file('run/mods').absolutePath,
        file('build/createSrgToMcp/output.srg').absolutePath,
        file('src/devcompat/resources/coremods/fix_injections.js').absolutePath
    ]
    
    // 设置工作目录
    workingDir = file('devtools')
    
    // 依赖 createSrgToMcp 任务（确保 output.srg 存在）
    dependsOn 'createSrgToMcp'
}